name: Update The Hindu Editorial Full-Text Feed

on:
  schedule:
    - cron: '15 */3 * * *'  # Runs every 3 hours at minute 15
  workflow_dispatch:        # Allows manual execution from GitHub UI

permissions:
  contents: write

jobs:
  build-and-update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Hindu Editorial Scraper
        run: python fetch_hindu_editorial.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || (git commit -m "chore: append new Hindu editorials" && git push)
